<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor MapBiomas Alerta</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root {
            --bg-primary: #12181b;
            --bg-surface: #1a232a;
            --bg-card: #24303c;
            --text-main: #f0f4f8;
            --text-muted: #9ba8b5;
            --accent-green: #2ecc71;
            --accent-alert: #e74c3c;
            --border-color: #2c3e50;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(18, 24, 27, 0.95); backdrop-filter: blur(8px);
            z-index: 5000; display: flex; justify-content: center; align-items: center;
        }

        .auth-card {
            background-color: var(--bg-surface); border: 1px solid var(--border-color);
            padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center;
        }

        .auth-card h2 { color: var(--accent-green); margin-bottom: 8px; }
        .auth-card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }
        .auth-form { display: flex; flex-direction: column; gap: 15px; text-align: left; }
        .auth-form label { font-size: 0.8rem; color: var(--text-muted); }
        .auth-form input {
            width: 100%; padding: 10px; background: var(--bg-card);
            border: 1px solid var(--border-color); color: #fff; border-radius: 6px; outline: none;
        }

        .btn-submit {
            background: var(--accent-green); color: #000; border: none;
            padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px;
        }

        #sidebar { width: 380px; background-color: var(--bg-surface); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 1000; }
        .header { padding: 20px; background-color: var(--bg-card); border-bottom: 1px solid var(--border-color); }
        .header h1 { font-size: 1.25rem; color: var(--accent-green); }
        .metrics-container { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card-metric { background-color: var(--bg-card); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); }
        .card-metric.full { grid-column: span 2; }
        .card-metric span { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
        .card-metric h2 { font-size: 1.1rem; margin-top: 4px; }
        .data-list-container { flex: 1; overflow-y: auto; padding: 15px; }
        .alert-item { background-color: var(--bg-card); padding: 12px; border-radius: 6px; margin-bottom: 8px; border-left: 4px solid var(--accent-alert); font-size: 0.85rem; cursor: pointer; }
        
        #map-container { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; }
        .dark-tiles .leaflet-tile-pane { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2><i class="fa-solid fa-tree"></i> MapBiomas Alerta</h2>
            <p>Cadastre-se para liberar os dados no painel</p>
            <form class="auth-form" onsubmit="handleAuth(event)">
                <div>
                    <label>Nome Completo</label>
                    <input type="text" id="auth-name" required placeholder="Seu nome">
                </div>
                <div>
                    <label>E-mail</label>
                    <input type="email" id="auth-email" required placeholder="seu@email.com">
                </div>
                <button type="submit" id="btn-auth" class="btn-submit">Entrar e Salvar</button>
            </form>
        </div>
    </div>

    <div id="sidebar">
        <div class="header">
            <h1><i class="fa-solid fa-tree"></i> MapBiomas Alerta</h1>
            <p id="user-display">Usuário: Não Conectado</p>
        </div>
        <div class="metrics-container">
            <div class="card-metric full">
                <span>Área Total Desmatada</span>
                <h2 id="metric-total-area">0,00 ha</h2>
            </div>
            <div class="card-metric">
                <span>Alertas</span>
                <h2 id="metric-alert-count">0</h2>
            </div>
            <div class="card-metric">
                <span>Bioma Mais Afetado</span>
                <h2 id="metric-top-biome">-</h2>
            </div>
        </div>
        <div class="data-list-container" id="alerts-list"></div>
    </div>

    <div id="map-container" class="dark-tiles">
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.js"></script>

    <script>
        const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyDST7GL70bhQE2aqoIocZoZb-CXqpffafXX2fkVj5Mb_lLxRMDEwuG9HGMJxh1YoJk/exec';
        let map, markersCluster;

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
        });

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([-14.2350, -51.9253], 4);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
            markersCluster = L.markerClusterGroup({ chunkedLoading: true });
            map.addLayer(markersCluster);
        }

        async function handleAuth(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-auth');
            btn.innerText = 'Salvando na planilha...';

            const nome = document.getElementById('auth-name').value;
            const email = document.getElementById('auth-email').value;

            try {
                // Envia para o Apps Script gravar no Sheets
                const response = await fetch(`${GAS_ENDPOINT}?acao=cadastrar&nome=${encodeURIComponent(nome)}&email=${encodeURIComponent(email)}&termo=true`, {
                    method: 'GET',
                    redirect: 'follow'
                });
                
                const res = await response.json();
                
                if (res.sucesso) {
                    document.getElementById('auth-overlay').style.display = 'none';
                    document.getElementById('user-display').innerText = `Usuário: ${nome}`;
                    renderDashboard(res.dados || []);
                } else {
                    alert('Erro ao registrar: ' + res.erro);
                }
            } catch (err) {
                console.error(err);
                alert('Falha na comunicação com o servidor.');
            } finally {
                btn.innerText = 'Entrar e Salvar';
            }
        }

        function renderDashboard(alerts) {
            const listElement = document.getElementById('alerts-list');
            listElement.innerHTML = '';
            markersCluster.clearLayers();

            if (!alerts || alerts.length === 0) {
                listElement.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 20px;">Nenhum alerta salvo na planilha. Execute a função buscarDadosMapBiomas no Apps Script.</p>';
                return;
            }

            let totalArea = 0;
            let biomesCount = {};

            alerts.forEach(alert => {
                const area = parseFloat(alert.area_ha || alert.area || 0);
                totalArea += area;
                const biome = alert.bioma || alert.biome || 'Outros';
                biomesCount[biome] = (biomesCount[biome] || 0) + 1;

                const item = document.createElement('div');
                item.className = 'alert-item';
                item.innerHTML = `
                    <header><b>Alerta: ${alert.codigo || alert.id}</b> - <span style="color: var(--accent-alert);">${area.toFixed(2)} ha</span></header>
                    <p><i class="fa-solid fa-location-dot"></i> ${alert.municipio || 'N/I'} - ${alert.estado || 'UF'}</p>
                `;

                const lat = parseFloat(alert.latitude || alert.lat);
                const lng = parseFloat(alert.longitude || alert.lng);

                if (!isNaN(lat) && !isNaN(lng)) {
                    item.onclick = () => map.setView([lat, lng], 12);
                    const marker = L.circleMarker([lat, lng], { radius: 8, fillColor: '#e74c3c', color: '#fff' });
                    markersCluster.addLayer(marker);
                }
                listElement.appendChild(item);
            });

            document.getElementById('metric-total-area').innerText = `${totalArea.toFixed(2)} ha`;
            document.getElementById('metric-alert-count').innerText = alerts.length;
        }
    </script>
</body>
</html>
