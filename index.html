<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor de Incêndios Aeroespaciais - Brasil</title>
  <!-- Não use integrity copiado/incorreto: quando o hash não confere, o CSS é bloqueado. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { --primary:#e65100; --dark:#212121; --light:#f5f5f5; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; }
    body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; margin:0; background:var(--light); color:var(--dark); }

    #cadastro-container { display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
    .card-cadastro { background:#fff; padding:30px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.1); width:100%; max-width:450px; }
    .card-cadastro h2 { margin-top:0; color:var(--primary); text-align:center; }
    .form-group { margin-bottom:15px; }
    .form-group label { display:block; margin-bottom:5px; font-weight:600; font-size:14px; }
    .form-group input { width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; }
    .termo-box { display:flex; align-items:flex-start; gap:10px; margin:20px 0; font-size:12px; color:#666; }
    .termo-box input { margin-top:3px; cursor:pointer; }
    .btn-enviar { width:100%; padding:12px; background:var(--primary); color:#fff; border:0; border-radius:6px; font-weight:bold; cursor:pointer; font-size:16px; }
    .btn-enviar:hover { background:#b33900; }
    .btn-enviar:disabled { background:#ccc; cursor:not-allowed; }
    .erro-api { color:#b00020; font-size:13px; margin-top:12px; text-align:center; }

    #monitor-container { display:none; flex-direction:column; width:100%; height:100vh; min-height:500px; }
    .kpi-bar { flex:0 0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:15px; padding:15px; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.05); z-index:1000; }
    .kpi-card { background:#fff3e0; border-left:5px solid var(--primary); padding:15px; border-radius:6px; box-shadow:0 2px 5px rgba(0,0,0,.05); }
    .kpi-card h3 { margin:0 0 5px; font-size:13px; text-transform:uppercase; color:#666; }
    .kpi-card .valor { font-size:24px; font-weight:bold; }
    .kpi-card .detalhe { font-size:12px; color:#888; margin-top:4px; }
    #map { flex:1 1 auto; width:100%; min-height:0; background:#dbeef2; }
    .fogo-marcador { font-size:22px; text-align:center; line-height:22px; cursor:pointer; }
    .map-status { position:absolute; z-index:1000; left:50%; top:calc(100% - 60px); transform:translateX(-50%); background:rgba(255,255,255,.95); padding:8px 12px; border-radius:6px; box-shadow:0 1px 5px rgba(0,0,0,.25); font-size:13px; display:none; }
  </style>
</head>
<body>
  <div id="cadastro-container">
    <div class="card-cadastro">
      <h2>Acesso ao Monitor</h2>
      <p style="text-align:center;font-size:13px;color:#666;margin-bottom:20px">Preencha seus dados de interesse para liberar o mapa com dados de satélite.</p>
      <form id="form-cadastro">
        <div class="form-group"><label for="nome">Nome Completo</label><input type="text" id="nome" required placeholder="Ex.: João Silva"></div>
        <div class="form-group"><label for="profissao">Profissão</label><input type="text" id="profissao" required placeholder="Ex.: Estudante, Engenheiro"></div>
        <div class="form-group"><label for="idade">Idade</label><input type="number" id="idade" required min="1" max="120" placeholder="Ex.: 24"></div>
        <div class="form-group"><label for="whatsapp">WhatsApp</label><input type="tel" id="whatsapp" required placeholder="Ex.: 11999999999"></div>
        <div class="form-group"><label for="email">E-mail</label><input type="email" id="email" required placeholder="Ex.: joao@email.com"></div>
        <div class="termo-box"><input type="checkbox" id="termo" required><label for="termo">Consinto em fornecer meus dados para o mapeamento de interesse em projetos aeroespaciais e tecnologias de monitoramento ambiental.</label></div>
        <button type="submit" id="btn-submit" class="btn-enviar">Validar e Acessar Mapa</button>
        <div id="erro-api" class="erro-api" role="alert"></div>
      </form>
    </div>
  </div>

  <div id="monitor-container">
    <div class="kpi-bar">
      <div class="kpi-card"><h3>Total de Focos Ativos</h3><div class="valor" id="kpi-total">0</div><div class="detalhe">Detectados em território nacional nas últimas 24h</div></div>
      <div class="kpi-card"><h3>Região Mais Afetada</h3><div class="valor" id="kpi-regiao">-</div><div class="detalhe" id="kpi-regiao-sub">Aguardando processamento...</div></div>
      <div class="kpi-card"><h3>Intensidade Média (FRP)</h3><div class="valor" id="kpi-frp">0 MW</div><div class="detalhe" id="kpi-frp-status">Poder radiativo do fogo medido</div></div>
    </div>
    <div id="map"></div>
    <div id="map-status" class="map-status"></div>
  </div>

  <!-- O CSS e o JS precisam ser da mesma versão do Leaflet. -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwwg4nHVV4BAbs3SFeF6utIdtHe4PnjHsp9c4cozWLE3sjlRIpMsecTd1-1O6hEyib9Cw/exec';
    let map;
    let markersLayer;

    function inicializarMapa() {
      if (map) return;
      map = L.map('map', { preferCanvas: true }).setView([-14.2350, -51.9253], 4);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);
    }

    function extrairFocos(resposta) {
      if (Array.isArray(resposta)) return resposta;
      if (resposta && Array.isArray(resposta.focos)) return resposta.focos;
      if (resposta && Array.isArray(resposta.dados)) return resposta.dados;
      return [];
    }

    function numeroFoco(foco, ...chaves) {
      for (const chave of chaves) {
        const valor = Number.parseFloat(String(foco?.[chave] ?? '').replace(',', '.'));
        if (Number.isFinite(valor)) return valor;
      }
      return null;
    }

    function processarDadosEMapa(focos) {
      const regioes = { Norte:0, Nordeste:0, 'Centro-Oeste':0, Sudeste:0, Sul:0 };
      let somaFrp = 0;
      let totalComFrp = 0;
      const fogoIcone = L.divIcon({ html:'🔥', className:'fogo-marcador', iconSize:[22,22], iconAnchor:[11,11] });
      markersLayer.clearLayers();

      focos.forEach(foco => {
        const lat = numeroFoco(foco, 'latitude', 'lat', 'LATITUDE', 'LAT');
        const lon = numeroFoco(foco, 'longitude', 'lon', 'lng', 'LONGITUDE', 'LON');
        const frp = numeroFoco(foco, 'frp', 'FRP') ?? 0;
        if (frp > 0) { somaFrp += frp; totalComFrp++; }

        if (lat !== null && lon !== null && lat >= -35 && lat <= 6 && lon >= -75 && lon <= -30) {
          let regiao = 'Centro-Oeste';
          if (lat > -5) regiao = 'Norte';
          else if (lat > -16 && lon > -48) regiao = 'Nordeste';
          else if (lat > -22) regiao = 'Sudeste';
          else regiao = 'Sul';
          regioes[regiao]++;

          const horario = foco.acq_time ?? foco.horario ?? foco.ACQ_TIME ?? 'N/A';
          L.marker([lat, lon], { icon:fogoIcone })
            .addTo(markersLayer)
            .bindPopup(`<b>Foco detectado por satélite</b><br>Latitude: ${lat.toFixed(4)}<br>Longitude: ${lon.toFixed(4)}<br>Intensidade: ${frp.toFixed(1)} MW<br>Horário GMT: ${horario}`);
        }
      });

      const total = focos.length;
      const media = totalComFrp ? (somaFrp / totalComFrp).toFixed(1) : '0.0';
      document.getElementById('kpi-total').textContent = total;
      document.getElementById('kpi-frp').textContent = `${media} MW`;
      document.getElementById('kpi-frp-status').textContent = Number(media) > 40 ? 'Status médio: crítico' : 'Status médio: moderado';

      if (total) {
        const maisAfetada = Object.keys(regioes).reduce((a,b) => regioes[a] >= regioes[b] ? a : b);
        document.getElementById('kpi-regiao').textContent = maisAfetada;
        document.getElementById('kpi-regiao-sub').textContent = `${regioes[maisAfetada]} focos com coordenadas válidas`;
      } else {
        document.getElementById('kpi-regiao').textContent = 'Nenhum';
        document.getElementById('kpi-regiao-sub').textContent = 'A API não retornou focos ativos.';
      }

      if (markersLayer.getLayers().length) {
        map.fitBounds(markersLayer.getBounds().pad(0.12), { maxZoom: 7 });
      } else {
        map.setView([-14.2350, -51.9253], 4);
      }
    }

    async function carregarFocos() {
      const resposta = await fetch(`${SCRIPT_URL}?acao=focos&t=${Date.now()}`, { cache:'no-store' });
      if (!resposta.ok) throw new Error(`GET retornou HTTP ${resposta.status}`);
      const texto = await resposta.text();
      let json;
      try { json = JSON.parse(texto); } catch { throw new Error('A API não retornou JSON válido.'); }
      if (json.erro) throw new Error(json.erro);
      return extrairFocos(json);
    }

    document.getElementById('form-cadastro').addEventListener('submit', async event => {
      event.preventDefault();
      const btn = document.getElementById('btn-submit');
      const erro = document.getElementById('erro-api');
      btn.disabled = true;
      btn.textContent = 'Liberando mapa aeroespacial...';
      erro.textContent = '';

      const payload = {
        nome: document.getElementById('nome').value.trim(),
        profissao: document.getElementById('profissao').value.trim(),
        idade: Number.parseInt(document.getElementById('idade').value, 10),
        whatsapp: document.getElementById('whatsapp').value.trim(),
        email: document.getElementById('email').value.trim(),
        termo: document.getElementById('termo').checked
      };

      try {
        // text/plain evita preflight CORS; o Apps Script lê e.postData.contents.
        await fetch(SCRIPT_URL, {
          method:'POST',
          mode:'no-cors',
          headers:{ 'Content-Type':'text/plain;charset=utf-8' },
          body:JSON.stringify(payload)
        });
        const focos = await carregarFocos();
        document.getElementById('cadastro-container').style.display = 'none';
        document.getElementById('monitor-container').style.display = 'flex';
        inicializarMapa();
        processarDadosEMapa(focos);
        requestAnimationFrame(() => map.invalidateSize(true));
      } catch (error) {
        console.error('Erro na comunicação com a API:', error);
        erro.textContent = `Não foi possível carregar os dados: ${error.message}`;
        btn.textContent = 'Tentar novamente';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
